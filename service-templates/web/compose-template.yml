version: "3.8"
services:
  ${SERVICE_NAME}:
    hostname: ${NETWORK_NAME}_${SERVICE_NAME}
    image: pkorduan/kvwmap-server:2.2.18
    container_name: ${NETWORK_NAME}_${SERVICE_NAME}
    restart: "always"
    networks:
      - kvwmap_prod
      - proxy
    environment:
      # Environment variables with only a key are resolved to their values on the ma>
      - OS_USER=gisadmin
      - IP_EXTERN=$IP_EXTERN
      - DOMAIN_EXTERN=$DOMAIN
      - KVWMAP_INIT_PASSWORD=$KVWMAP_INIT_PASSWORD
      - TERM=linux
      - COLUMNS=180
      - LINES=200
      - VIRTUAL_HOST=$DOMAIN
      - LETSENCRYPT_HOST=$DOMAIN
      - LETSENCRYPT_EMAIL=peter.korduan@gdi-service.de
    volumes:
      - ../../volumes/proj/proj.db:/usr/share/proj/proj.db
      - ../../volumes/proj/epsg:/usr/share/proj/epsg
      - ../../volumes/proj/MVTR2010.gsb:/usr/share/proj/MVTR2010.gsb
      - ../../volumes/proj/MVTRS4283.gsb:/usr/share/proj/MVTRS4283.gsb
      - ./apache2/sites-available:/etc/apache2/sites-available
      - ./apache2/sites-enabled:/etc/apache2/sites-enabled
      - ./apache2/conf-available:/etc/apache2/conf-available
      #- ./apache2/mods-available:/etc/apache2/mods-available
      #- ./apache2/mods-enabled:/etc/apache2/mods-enabled
      - ./cron/load_cron_files:/etc/cron.hourly/load_cron_files
      - ./php/7.4:/etc/php/7.4
      - ./www:/var/www
      - ./log:/var/log/apache2
      - ${USER_DIR}/networks/${NETWORK_NAME}/services/pgsql/config/.pgpass:/root/.pgpass
      - ${USER_DIR}/networks/${NETWORK_NAME}/services/pgsql/config/.pgpass_gisadmin:/home/gisadmin/.pgpass
networks:
  proxy:
    external: true
  kvwmap_prod:
    external: true
