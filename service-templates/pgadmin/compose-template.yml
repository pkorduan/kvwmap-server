version: '3.8'
services:
  pgadmin:
    hostname: ${NETWORK_NAME}_${SERVICE_NAME
    container_name: ${NETWORK_NAME}_${SERVICE_NAME}
    image: dpage/pgadmin4
    command: dpage/pgadmin4
    restart: "always"
    environment:
      - PGADMIN_DEFAULT_EMAIL=peter.korduan@gdi-service.de
      - PGADMIN_DEFAULT_PASSWORD=$PGADMIN_DEFAULT_PASSWORD
      - SCRIPT_NAME=/pgadmin
      - VIRTUAL_PATH=/pgadmin
      - VIRTUAL_HOST=$DOMAIN
    volumes:
      - ./data:/var/lib/pgadmin
      - ./config/servers.json:/pgadmin4/servers.json
      - ../../pgsql/config/.pgpass:/var/lib/pgadmin/.pgpass
#      - /home/gisadmin/networks/kvwmap_prod/services/pgsql/config/.pgpass:/var/lib/pgadmin/.pgpass
    networks:
      - kvwmap_prod
      - proxy

networks:
  kvwmap_prod:
      external: true
  proxy:
    external: true
