version: "3.6"
services:
  mariadb:
    hostname: ${NETWORK_NAME:-kvwmap_prod}_${SERVICE_NAME:-mariadb}
    container_name: ${NETWORK_NAME:-kvwmap_prod}_${SERVICE_NAME:-mariadb}
    image: mariadb:11.4.3
    ports:
      - 3306:3306
    networks:
      default:
        aliases:
          - mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER:-kvwmap}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - ./data:/var/lib/mysql
      - ./logs:/var/logs/mysql
      - ./dumps:/dumps
      - ./etc/initdb.sql:/docker-entrypoint-initdb.d/10_grant_user_kvwmap.sql
    restart: always
networks:
  default:
    name: ${NETWORK_NAME}
    external: true
